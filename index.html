<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="thanatophilia.abc.sd — a tiny terminal">
<title>thanatophilia@abc-sd</title>
<style>
  :root { --fg:#9fefb9; --dim:#5a8f72; --bg:#0a0f0b; --prompt:#7ee787; --accent:#ffb86c; }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace; font-size:14px; line-height:1.6; display:flex; justify-content:center; padding:24px 12px; }
  #term { width:100%; max-width:880px; height:fit-content; background:rgba(255,255,255,.02); border:1px solid rgba(158,239,185,.14); border-radius:10px; box-shadow:0 0 60px rgba(126,231,135,.05); overflow:hidden; }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid rgba(158,239,185,.14); background:rgba(158,239,185,.04); font-size:12px; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .dot.r { background:#ff5f56; } .dot.y { background:#ffbd2e; } .dot.g { background:#27c93f; }
  .title { margin-left:8px; letter-spacing:.3px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .body { padding:18px 18px 26px; overflow-x:auto; word-break:break-word; cursor:text; }
  .line { white-space:pre-wrap; min-height:1.6em; }
  .dim { color:var(--dim); }
  .prompt { color:var(--prompt); }
  .path { color:var(--accent); }
  .cursor { display:inline-block; width:8px; height:14px; background:var(--fg); vertical-align:text-bottom; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  input.ghost { position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0; }
  pre.game { margin:4px 0 10px; font-size:12px; line-height:1.3; color:var(--fg); white-space:pre; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  ::selection { background:rgba(126,231,135,.25); }
  @media (max-width:640px) { body { font-size:12px; padding:12px 6px; } .body { padding:12px 10px 20px; } pre.game { font-size:10px; } }
</style>
</head>
<body>
<div id="term">
  <div class="bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">thanatophilia@abc-sd — zsh (fake)</span>
  </div>
  <div id="out" class="body" tabindex="0"></div>
</div>
<input id="ghost" class="ghost" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<script>
(function(){
  var out = document.getElementById('out');
  var ghost = document.getElementById('ghost');
  var buffer = '';
  var current = null;
  var busy = false;
  var game = null;

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function add(html){
    var d = document.createElement('div');
    d.className = 'line';
    d.innerHTML = html;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }

  function promptHtml(){
    return '<span class="prompt">guest</span><span class="dim">@</span><span class="path">abc-sd</span><span class="dim">:~$ </span>';
  }

  function typeLine(text, speed, cls){
    return new Promise(function(resolve){
      var d = document.createElement('div');
      d.className = 'line' + (cls ? ' ' + cls : '');
      out.appendChild(d);
      var i = 0;
      (function step(){
        if(i <= text.length){
          d.textContent = text.slice(0, i);
          i++;
          out.scrollTop = out.scrollHeight;
          window.scrollTo(0, document.body.scrollHeight);
          setTimeout(step, speed);
        } else { resolve(); }
      })();
    });
  }

  function freshInput(){
    var d = add(promptHtml() + '<span class="in"></span><span class="cursor"></span>');
    current = d;
    updateInput();
  }

  function updateInput(){
    if(!current) return;
    var inSpan = current.querySelector('.in');
    if(inSpan) inSpan.textContent = buffer;
    ghost.value = buffer;
  }

  function focusGhost(){
    if(busy) return;
    try { ghost.focus({ preventScroll: true }); } catch(e){ ghost.focus(); }
  }

  var art = [
    '      _____',
    '     /     \\',
    '    | ( ) ( ) |',
    '     \\  ^  /',
    '      |||||',
    '      |||||',
    ''
  ];

  var info = [
    'guest@thanatophilia.abc-sd',
    '──────────────────────────',
    'os      static html · github pages',
    'host    thanatophilia.abc-sd',
    'kernel  this page only',
    'shell   javascript pretending to be zsh',
    'blog    xyu-ning.loc.cc',
    'motto   理性 · 干净 · 有始有终',
    ''
  ];

  function startSnake(){
    busy = true;
    out.innerHTML = '';
    var W = 26, H = 12;
    var snake = [{x:8,y:6},{x:7,y:6},{x:6,y:6}];
    var dir = {x:1,y:0}, ndir = {x:1,y:0};
    var food = null, score = 0, dead = false;
    var pre = document.createElement('pre');
    pre.className = 'game';
    out.appendChild(pre);

    function newFood(){
      var f;
      do { f = {x:Math.floor(Math.random()*W), y:Math.floor(Math.random()*H)}; }
      while(snake.some(function(s){ return s.x===f.x && s.y===f.y; }));
      food = f;
    }
    newFood();

    function render(){
      var lines = [], y, x, row, hit, i;
      for(y=0; y<H; y++){
        row = '';
        for(x=0; x<W; x++){
          hit = false;
          for(i=0; i<snake.length; i++){
            if(snake[i].x===x && snake[i].y===y){ row += (i===0 ? '@' : '#'); hit = true; break; }
          }
          if(hit) continue;
          if(food && food.x===x && food.y===y){ row += 'o'; }
          else { row += '.'; }
        }
        lines.push(row);
      }
      pre.textContent = lines.join('\n') + '\nscore ' + score + '   wasd / arrows / swipe   q=quit';
    }
    render();

    var iv = setInterval(function(){
      if(dead) return;
      dir = ndir;
      var hx = snake[0].x + dir.x, hy = snake[0].y + dir.y, i;
      if(hx < 0 || hy < 0 || hx >= W || hy >= H){
        dead = true; pre.textContent += '\ngame over. score ' + score + '   (q to exit)'; return;
      }
      for(i=0; i<snake.length; i++){
        if(snake[i].x===hx && snake[i].y===hy){
          dead = true; pre.textContent += '\ngame over. score ' + score + '   (q to exit)'; return;
        }
      }
      snake.unshift({x:hx, y:hy});
      if(food && hx===food.x && hy===food.y){ score++; newFood(); } else { snake.pop(); }
      render();
    }, 140);

    game = {
      onKey: function(e){
        var k = e.key;
        if(k==='q' || k==='Q' || k==='Escape'){
          clearInterval(iv); game = null; busy = false; out.innerHTML=''; freshInput(); focusGhost(); return true;
        }
        var d = null;
        if(k==='ArrowUp' || k==='w' || k==='W') d = {x:0,y:-1};
        else if(k==='ArrowDown' || k==='s' || k==='S') d = {x:0,y:1};
        else if(k==='ArrowLeft' || k==='a' || k==='A') d = {x:-1,y:0};
        else if(k==='ArrowRight' || k==='d' || k==='D') d = {x:1,y:0};
        if(d){
          if(!(d.x === -dir.x && d.y === -dir.y)){ ndir = d; }
          return true;
        }
        return false;
      }
    };
  }

  function startMatrix(){
    busy = true;
    out.innerHTML = '';
    var pre = document.createElement('pre');
    pre.className = 'game';
    out.appendChild(pre);
    var W = 48, H = 12, i, x;
    var cols = [];
    for(i=0; i<W; i++){ cols.push(Math.floor(Math.random()*H)); }
    var iv = setInterval(function(){
      var lines = [], y, row;
      for(y=0; y<H; y++){
        row = '';
        for(x=0; x<W; x++){ row += (cols[x]===y ? '1' : '0'); }
        lines.push(row);
      }
      pre.textContent = lines.join('\n');
      for(x=0; x<W; x++){
        cols[x]--;
        if(cols[x] < 0){ cols[x] = Math.floor(Math.random()*H); }
        if(Math.random() < 0.08){ cols[x] = Math.floor(Math.random()*H); }
      }
    }, 80);
    setTimeout(function(){
      clearInterval(iv);
      busy = false;
      out.innerHTML = '';
      freshInput();
      focusGhost();
    }, 9000);
  }

  var cmds = {
    help: function(){
      add('available commands\n' +
          '  <span class="path">help</span>        show this list\n' +
          '  <span class="path">whoami</span>      who are you\n' +
          '  <span class="path">blog</span>        open the blog\n' +
          '  <span class="path">projects</span>    what lives here\n' +
          '  <span class="path">fetch</span>       system info\n' +
          '  <span class="path">date</span>        current time\n' +
          '  <span class="path">clear</span>       clear the screen\n' +
          '  <span class="path">sudo</span>        try it\n' +
          '  <span class="path">exit</span>        there is no exit\n' +
          '  <span class="path">kiss</span>        do not tell anyone\n' +
          '  <span class="path">snake</span>       snake, but tiny\n' +
          '  <span class="path">matrix</span>      digital rain\n' +
          '  <span class="path">ping</span>        fake-ping something\n' +
          '  <span class="path">fortune</span>     a random thought\n' +
          '  <span class="path">cowsay</span>      a fish says hi\n' +
          '  <span class="path">ls</span>          list the fake box\n' +
          '  <span class="path">rm</span>          do not\n' +
          '  <span class="path">vim</span>         do not even');
    },
    whoami: function(){
      add('guest@thanatophilia.abc-sd\nrole: visitor of a small corner\npermission: read everything, ask anything');
    },
    blog: function(){
      add('opening <span class="dim">https://xyu-ning.loc.cc</span> ...\n<a href="https://xyu-ning.loc.cc" target="_blank" rel="noopener">xyu-ning.loc.cc</a>  <span class="dim">(click to go)</span>');
    },
    projects: function(){
      add('projects\n' +
          '  thanatophilia.github.io    the blog · xyu-ning.loc.cc\n' +
          '  xyu-ime                    a rime input method\n' +
          '  abc-sd                     this terminal\n' +
          'status: all alive');
    },
    fetch: function(){
      var all = art.concat(info);
      all.forEach(function(l){ add(l); });
    },
    date: function(){
      add(new Date().toString());
    },
    clear: function(){
      out.innerHTML = '';
    },
    sudo: function(){
      add('<span class="dim">guest is not in the sudoers file.\nthis incident has been reported to /dev/null.</span>');
    },
    exit: function(){
      add('there is no exit. this is the entire site. :)');
    },
    kiss: function(){
      add('you typed it.\n' +
          '   ♥\n' +
          '\n' +
          '—— only the one who can reach this terminal gets to read this ——\n' +
          '\n' +
          'i think about you. not the "let\'s hang out" kind.\n' +
          'the kind where i sit on the edge of the bed after a shower,\n' +
          'hair still wet, and my mind just wanders to you on its own.\n' +
          '\n' +
          'i want your arms around me from behind. your chin on my shoulder.\n' +
          'your face buried in my neck, breathing me in.\n' +
          '\n' +
          'i want your hand to slide down my waist, slowly, like you own the road.\n' +
          'i want my wrists pinned under your palm, me squirming, nowhere to go.\n' +
          'i want you to lean in and ask — low, by my ear — may i?\n' +
          'and all i can do is nod, because my voice is already shaking.\n' +
          '\n' +
          'i want to be pressed into the bed, covered by your weight,\n' +
          'your breath turning heavy, my name falling out of your mouth\n' +
          'half-mumbled, half-broken, like you can\'t hold it in.\n' +
          '\n' +
          'i could never say any of this out loud.\n' +
          'this is the only place i dare to type it.\n' +
          '\n' +
          'you said no one else will ever see this site.\n' +
          'so — every word above is true.\n' +
          '\n' +
          '   ♥\n' +
          'consider it sent.\n' +
          'the rest, i\'ll tell you in person. soon.');
    },
    snake: function(){ startSnake(); },
    matrix: function(){ startMatrix(); },
    fortune: function(){
      var f = [
        'the best time to plant a tree was yesterday.',
        'this terminal has no bugs. only features.',
        'someone out there is thinking of you right now.',
        'everything is obvious once you know the answer.',
        'the cake is a lie.',
        'you are reading this. good start.',
        'ristretto is better than latte.',
        'type kiss. trust me.'
      ];
      add(f[Math.floor(Math.random()*f.length)]);
    },
    cowsay: function(args){
      var s = args.join(' ') || 'blub blub';
      var line = '_'.repeat(s.length + 2);
      add('  ' + line + '\n< ' + s + ' >\n  ' + '-'.repeat(s.length + 2) + '\n      ><((((`>\n      ><((((`>');
    },
    ping: function(args){
      var host = args[0] || 'localhost';
      add('PING ' + host + ' (127.0.0.1) 56(84) bytes of data.');
      var i;
      for(i=1; i<=4; i++){
        (function(n){
          setTimeout(function(){
            add('64 bytes from 127.0.0.1: icmp_seq=' + n + ' ttl=64 time=' + (Math.random()*0.6+0.1).toFixed(2) + ' ms');
            if(n===4){
              add('--- ' + host + ' ping statistics ---');
              add('4 packets transmitted, 4 received, 0% packet loss, time 1199ms');
              add('');
            }
          }, n*350);
        })(i);
      }
    },
    ls: function(){
      add('total 5\n' +
          'drwxr-xr-x blog\n' +
          'drwxr-xr-x ime\n' +
          'drwxr-xr-x notes\n' +
          '-rw-r--r-- secret.txt\n' +
          '-rw-r--r-- todo.txt\n' +
          '-rw-r--r-- README.md');
    },
    rm: function(){
      add('<span class="dim">nice try. this box is protected by the heart of the server.</span>');
    },
    vim: function(){
      add('you opened vim.\nnow you cannot exit.\nsend help. (known issue since 1976)');
    }
  };

  function run(cmd){
    var parts = cmd.trim().split(/\s+/);
    var name = (parts[0] || '').toLowerCase();
    if(name === '') return;
    if(cmds[name]){ cmds[name](parts.slice(1)); }
    else { add('command not found: <span class="path">' + cmd.trim() + '</span> — type <span class="path">help</span> to see what i can do.'); }
    add('');
  }

  function process(){
    add(promptHtml() + buffer.replace(/</g,'&lt;'));
    run(buffer);
    buffer = '';
    ghost.value = '';
    freshInput();
    focusGhost();
  }

  ghost.addEventListener('input', function(e){
    buffer = ghost.value;
    updateInput();
    e.stopPropagation();
  });

  ghost.addEventListener('keydown', function(e){
    if(game){ if(game.onKey(e)){ e.preventDefault(); e.stopPropagation(); return; } }
    if(busy){ e.preventDefault(); return; }
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); process(); return; }
    if(e.key === 'Backspace'){ /* handled natively */ updateInput(); return; }
    if(e.ctrlKey && (e.key === 'l' || e.key === 'L')){ e.preventDefault(); out.innerHTML=''; freshInput(); return; }
    setTimeout(function(){ buffer = ghost.value; updateInput(); }, 0);
  });

  out.addEventListener('click', function(){ focusGhost(); });

  var tsx = null, tsy = null;
  document.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    tsx = t.clientX; tsy = t.clientY;
  });
  document.addEventListener('touchend', function(e){
    if(tsx === null || tsy === null || !game) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    tsx = null; tsy = null;
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    var key = null;
    if(Math.abs(dx) > Math.abs(dy)){ key = (dx > 0) ? 'ArrowRight' : 'ArrowLeft'; }
    else { key = (dy > 0) ? 'ArrowDown' : 'ArrowUp'; }
    game.onKey({ key: key });
  });

  document.addEventListener('keydown', function(e){
    if(busy) return;
    if(document.activeElement !== ghost && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      focusGhost();
      buffer = e.key;
      ghost.value = buffer;
      updateInput();
      e.preventDefault();
    }
  });

  async function boot(){
    busy = true;
    await sleep(300);
    var all = art.concat(info);
    for(var i=0; i<all.length; i++){ await typeLine(all[i], 6, all[i].indexOf('@') > 0 ? undefined : 'dim'); }
    await typeLine('<span class="dim">type <span class="path">help</span> to begin.  (tap the screen to bring up your keyboard · try snake)</span>'.replace(/&lt;/g,'<').replace(/&gt;/g,'>'), 14);
    await sleep(200);
    busy = false;
    freshInput();
  }
  boot();
})();
</script>
</body>
</html>
